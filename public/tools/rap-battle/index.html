<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Генератор острых тем для импровизационного рэп-баттла."
    />
    <title>Рэп батл! — инструменты для импровизации</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../../portal/styles.css" />
  <script src="../../portal/navigation.js" defer></script>
</head>
  <body class="battle-page">
    <div class="portal-header" data-portal-root="../../" data-portal-tool="rap-battle">
      <nav class="portal-nav" aria-label="Основная навигация">
        <a class="portal-brand" href="../../" data-formats-link>ImproFormats</a>
        <details class="portal-picker">
          <summary aria-label="Темы батлов. Выбрать раздел">
            <span class="portal-current-name">Темы батлов</span>
            <svg class="portal-chevron" viewBox="0 0 12 8" aria-hidden="true"><path d="m1 1.5 5 5 5-5" /></svg>
          </summary>
          <div class="portal-menu">
            <a class="portal-formats" href="../../" data-formats-link>
              <svg class="portal-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h6v18H4zM14 3h6v18h-6zM4 7h6M14 7h6" /></svg>
              <span>Форматы</span>
            </a>
            <div class="portal-menu-links"></div>
          </div>
        </details>
      </nav>
    </div>
    

    <main class="battle-shell">
      <header class="battle-header">
        <h1>Рэп<br />батл!</h1>
      </header>

      <section class="matchup" aria-labelledby="matchup-title">
        <h2 id="matchup-title" class="visually-hidden">Тема баттла</h2>

        <article class="side side--left">
          <p id="leftSide" class="side__name">КТО?</p>
        </article>

        <div class="versus" aria-hidden="true">
          <span>VS</span>
        </div>

        <article class="side side--right">
          <p id="rightSide" class="side__name">ПРОТИВ КОГО?</p>
        </article>
      </section>

      <button id="topicButton" class="topic-button" type="button">
        <span>ДАЙ ТЕМУ</span>
        <span class="topic-button__mark" aria-hidden="true">↯</span>
      </button>

      <p id="liveTopic" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    </main>

    <noscript>
      <p class="noscript-message">Для генерации тем нужен включённый JavaScript.</p>
    </noscript>

    <script src="./topics.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
