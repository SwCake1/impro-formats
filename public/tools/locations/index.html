<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Генератор случайных локаций для начала импровизационной сцены — перекидное табло."
    />
    <title>Генератор локаций — инструменты для импровизации</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../../portal/styles.css" />
  <script src="../../portal/navigation.js" defer></script>
</head>
  <body class="locations-page">
    <div class="portal-header" data-portal-root="../../" data-portal-tool="locations">
      <nav class="portal-nav" aria-label="Основная навигация">
        <a class="portal-brand" href="../../" data-formats-link>ImproFormats</a>
        <details class="portal-picker">
          <summary aria-label="Локации. Выбрать раздел">
            <span class="portal-current-name">Локации</span>
            <svg class="portal-chevron" viewBox="0 0 12 8" aria-hidden="true"><path d="m1 1.5 5 5 5-5" /></svg>
          </summary>
          <div class="portal-menu">
            <a class="portal-formats" href="../../" data-formats-link>
              <svg class="portal-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h6v18H4zM14 3h6v18h-6zM4 7h6M14 7h6" /></svg>
              <span>Форматы</span>
            </a>
            <div class="portal-menu-links"></div>
          </div>
        </details>
      </nav>
    </div>
    

    <main class="locations-shell">
      <header class="locations-header">
        <h1 class="locations-title">Место действия</h1>
      </header>

      <section class="board-wrap" aria-labelledby="board-title">
        <h2 id="board-title" class="visually-hidden">Локация</h2>
        <div id="board" class="board" aria-hidden="true"></div>
        <p id="counter" class="board-counter" aria-hidden="true"></p>
        <p id="liveLocation" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
      </section>

      <button id="nextButton" class="board-button" type="button">
        <span class="board-button__text">Дай локацию</span>
        <span class="board-button__mark" aria-hidden="true">↝</span>
      </button>

      <p class="board-hint">Пробел, Enter или стрелка вправо — следующая локация</p>
    </main>

    <noscript>
      <p class="noscript-message">Для генерации локаций нужен включённый JavaScript.</p>
    </noscript>

    <script src="./locations.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
